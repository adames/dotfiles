name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # tmux is required so we can parse-check configs/tmux.conf with a
      # short-lived isolated server. bash + jq are pre-installed on
      # ubuntu-latest, so no other deps needed.
      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      # Plain `bash -n` over the tree is NOT a step here: the bash unit
      # tests below already parse-check every script (same content-based
      # discovery, since the bin/ tools have no .sh suffix) and additionally
      # reject bash-4-only constructs. One discovery loop, not two.
      #
      # shellcheck catches real defects bash -n can't (dead error
      # handling, unquoted splits, masked exit codes). Gated at
      # severity=error only: errors are rare and almost always genuine
      # bugs, so this won't redden the build on style nits. Dynamic
      # `. "$DOTFILES_DIR/lib/..."` sources resolve at info level (SC1090),
      # below the gate, so they don't fail here.
      - name: shellcheck (errors only)
        run: |
          sudo apt-get install -y -qq shellcheck
          find . -type f \
                 -not -path '*/.git/*' \
                 -print0 \
            | while IFS= read -r -d '' f; do
                case "$f" in
                  */zshrc|*/bashrc) ;;   # zsh/interactive rc — bash -n only
                  *.sh) printf '%s\0' "$f" ;;
                  *) head -c2 "$f" | grep -q '^#!' \
                       && head -1 "$f" | grep -Eq '\b(ba)?sh\b' \
                       && printf '%s\0' "$f" ;;
                esac
              done \
            | xargs -0 -r shellcheck --severity=error --shell=bash

      - name: JSON syntax on every config
        run: |
          find . -type f -name '*.json' \
                 -not -path '*/.git/*' \
                 -print0 \
            | xargs -0 -n1 jq -e . >/dev/null

      - name: bash unit tests
        run: tests/run-all.sh

      # Parse-check tmux.conf in an isolated server so the host's
      # ~/.tmux.conf (if any) doesn't interfere. -L gives a unique
      # socket namespace; kill-server cleans up immediately.
      - name: tmux config parses
        run: |
          tmux -f configs/tmux.conf -L ci-probe start-server \; \
               new-session -d -s probe \; \
               kill-server
