set-option -g default-shell /bin/zsh

# C-Space prefix. No Option (M-*) bindings: they collide with Caps-tap-Escape
# in Ghostty, since both start with the ESC byte and any escape-time value
# creates an ambiguity that fires the Option binding when the user wanted ESC.
unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits — v/s mirrors nvim Ctrl-w
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind z resize-pane -Z
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# No confirmation on pane/window kill — git history covers anything that
# matters, and the `Kill pane #N? (y/n)` prompt is a constant friction tax
# in the inner dev loop. Default was `confirm-before -p ... kill-pane`.
bind x kill-pane
bind & kill-window

# fzf project picker → switch/create session
bind f display-popup -E -w 80% -h 60% "tmux-sessionizer"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# 10ms: long enough for escape sequences to arrive complete; short enough
# that nvim's <Esc> feels instant. 0 breaks Caps-tap → ESC + any key.
set -sg escape-time 10
set -g focus-events on
