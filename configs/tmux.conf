# Default shell (override per-host via TMUX_DEFAULT_SHELL if needed)
set-option -g default-shell /bin/zsh

# ── Prefix ───────────────────────────────────────────────────────────────────
# Ctrl+a: reliable, universal, works in every terminal.
# Caps Lock TAP now sends Escape (great for vim/zsh-vim; was F13, which was
# terminal-encoding-dependent and caused "messed up" behaviour with zsh-vim).
# Use prefix for infrequent ops only: splits and config reload.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Pane navigation (prefix-free) ────────────────────────────────────────────
# Option+h/j/k/l — no prefix needed.  Works because:
#   • Ghostty: macos-option-as-alt=left → Option+h sends \eh (Meta-h)
#   • tmux:    M-h/j/k/l bound here with -n (no prefix)
#   • skhd:    only binds Hyper and Meh, so Option+hjkl passes through
#
# Mental model — hjkl always moves you; the modifier sets the scope:
#   Space (leader) = within Neovim splits
#   Option         = between tmux panes    ← these four lines
#   Hyper          = between OS windows (yabai)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix+hjkl still works as a fallback (handy in SSH where Option key may
# misbehave or be remapped by the connecting terminal).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits ───────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Config reload ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Mouse, indexing ──────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# ── Performance ──────────────────────────────────────────────────────────────
# 0ms: Escape is no longer the tmux prefix, so there's no ambiguity to wait
# for. Neovim benefits most from this (instant <Esc> in insert mode).
set -sg escape-time 0
set -g focus-events on
