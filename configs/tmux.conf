# Default shell (override per-host via TMUX_DEFAULT_SHELL if needed)
set-option -g default-shell /bin/zsh

# ── Prefix ───────────────────────────────────────────────────────────────────
# Ctrl+a — the prefix key.  Caps Lock tap sends Escape (not F13 anymore),
# so Ctrl+a is used only for the rare things Option can't cover: copy mode,
# zoom, detach, rename, and sending Ctrl-a through to a program.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Option layer: ALL routine tmux operations, no prefix needed ──────────────
#
# Ghostty's macos-option-as-alt=left turns Option+key into Meta (M-) which
# tmux binds directly via -n.  skhd only intercepts Hyper and Meh, so
# Option passes through cleanly.
#
# Mental model — same hjkl motion, modifier sets the scope:
#   ⟨Space⟩  leader    = Neovim splits
#   Option             = tmux panes      ← this whole block
#   Hyper    Caps hold = OS windows (yabai)

# Navigate panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Split panes — v/s mirrors Neovim's Ctrl-w v / Ctrl-w s convention
bind -n M-v split-window -h -c "#{pane_current_path}"   # vertical divider → pane right
bind -n M-s split-window -v -c "#{pane_current_path}"   # split → pane below

# Reload config
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Prefix fallback (useful over SSH where Option may be remapped) ────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Mouse, indexing ──────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# ── Performance ──────────────────────────────────────────────────────────────
# 0ms: Escape is not the tmux prefix — Neovim gets instant <Esc>.
set -sg escape-time 0
set -g focus-events on
