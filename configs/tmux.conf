set-option -g default-shell /bin/zsh

# C-Space prefix. No Option (M-*) bindings: they collide with Caps-tap-Escape
# in Ghostty, since both start with the ESC byte and any escape-time value
# creates an ambiguity that fires the Option binding when the user wanted ESC.
unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits — v/s mirrors nvim Ctrl-w
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind z resize-pane -Z
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# No confirmation on pane/window kill — git history covers anything that
# matters, and the `Kill pane #N? (y/n)` prompt is a constant friction tax
# in the inner dev loop. Default was `confirm-before -p ... kill-pane`.
bind x kill-pane
bind & kill-window

# fzf project picker → switch/create session
bind f display-popup -E -w 80% -h 60% "tmux-sessionizer"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# 10ms: long enough for escape sequences to arrive complete; short enough
# that nvim's <Esc> feels instant. 0 breaks Caps-tap → ESC + any key.
set -sg escape-time 10
set -g focus-events on

# True-colour. Ghostty advertises tmux-256color; the override unlocks RGB
# escape sequences so the workspace chip actually paints in slot colour.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# ── statusline · workspace identity ─────────────────────────────────────
# Workspace identity (left). Color + icon + name come from the yabai
# space_changed signal, pushed via tmux set-environment from
# configs/workspace/on-space-changed.sh. The #{E:VAR} interpolation
# requires tmux ≥ 3.2 (asserted by configs/workspace/install.sh).
#
# Mental model: tmux session = "what I'm doing right now". yabai workspace
# = "what mode I'm in". Left chip = mode; right segment = session + git/SSH.

set -g status on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=#181825,fg=#a6adc8"

set -g status-left-length  40
set -g status-left  "#[bg=#{E:MACOS_SPACE_COLOR},fg=#181825,bold] #{E:MACOS_SPACE_ICON}  #{E:MACOS_SPACE_NAME} #[bg=#181825,fg=#{E:MACOS_SPACE_COLOR}] "

# Right: SSH chip (only when $SSH_CONNECTION is set in the pane), tmux
# session name, and current git branch (silenced when not in a repo).
# status-interval 5 is for SSH/git refresh; workspace pushes immediately
# via the signal handler, so it's never stale.
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?SSH_CONNECTION,#[fg=#89dceb]󰒋 #h ,}#[fg=#6c7086]#S #[fg=#cba6f7]#(cd '#{pane_current_path}' && git symbolic-ref --short HEAD 2>/dev/null) "
set -g status-interval 5

# Window list: dim by default; current window picks up the slot colour.
set -g window-status-separator      ""
set -g window-status-format         "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#{E:MACOS_SPACE_COLOR},bold] #I #W "

# Message line (prefix mode, error display) uses the slot colour so even
# the rare command surfaces feel coherent with the workspace identity.
set -g message-style       "bg=#181825,fg=#{E:MACOS_SPACE_COLOR}"
set -g mode-style          "bg=#{E:MACOS_SPACE_COLOR},fg=#181825"

# Pane border picks up the active slot too, but dim — the SketchyBar
# pill strip is the primary cue; tmux pane border just echoes it
# inside the terminal.
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#{E:MACOS_SPACE_COLOR}"
