set-option -g default-shell /bin/zsh

# Prefix is Ctrl+A — pressed with the literal Ctrl key, no Caps Lock
# involvement. The yabai-era Caps+Space → Ctrl+Space Karabiner downgrade
# went away with the Hyperkey migration (Hyperkey can't reproduce the
# Karabiner Caps+Space downgrade) so prefix moved off the Hyper layer.
#
# No M-* bindings: ambiguous with ESC byte in Ghostty.
# @cs section Tmux
# @cs family terminal
# @cs sub prefix = C-a
# @cs idea C-a is your prefix. Everything after it is one keystroke — pane, window, or session.
# @cs row C-a  hjkl       :: select pane  ←  ↓  ↑  →
# @cs row C-a  v / s      :: split right / below  (mirrors vim C-w)
# @cs row C-a  | / -      :: split right / below  (aliases)
# @cs row C-a  z          :: zoom pane (toggle)
# @cs row C-a  d          :: detach session
# @cs row C-a  r          :: reload tmux.conf
# @cs row C-a  [          :: copy / scroll mode  (q to exit)
# @cs row C-a  f          :: sessionizer — fzf pick → switch/create session
# @cs row C-a  c          :: new window
# @cs row C-a  n / p      :: next / prev window
# @cs row C-a  0…9        :: go to window N
# @cs row C-a  x          :: kill pane  (no confirmation)
# @cs row C-a  &          :: kill window  (no confirmation)
# @cs row C-a  $          :: rename current session
# @cs row C-a  C-a    :: send literal C-a to inner program (nvim cmp)
# @cs end

unbind C-b
set-option -g prefix C-a
bind-key -N "send literal C-a"  C-a send-prefix

# Pane nav
bind -N "pane left"  h select-pane -L
bind -N "pane down"  j select-pane -D
bind -N "pane up"    k select-pane -U
bind -N "pane right" l select-pane -R

# Splits — v/s mirrors nvim Ctrl-w
bind -N "split right (vim Ctrl-w v)" v split-window -h -c "#{pane_current_path}"
bind -N "split below (vim Ctrl-w s)" s split-window -v -c "#{pane_current_path}"
bind -N "split right (alt key)"      | split-window -h -c "#{pane_current_path}"
bind -N "split below (alt key)"      - split-window -v -c "#{pane_current_path}"

bind -N "zoom pane (toggle)"  z resize-pane -Z
bind -N "detach session"      d detach-client
bind -N "reload tmux.conf"    r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# No confirmation on kill — the prompt is too frequent a tax.
bind -N "kill pane (no confirm)"   x kill-pane
bind -N "kill window (no confirm)" & kill-window

# fzf project picker → switch/create session
bind -N "sessionizer (fzf project picker)" f display-popup -E -w 80% -h 60% "tmux-sessionizer"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# 10ms: ESC sequences arrive complete without making nvim's Esc feel laggy.
set -sg escape-time 10
set -g focus-events on

# True-colour: override unlocks RGB so workspace chip paints in slot colour.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# ── statusline ───────────────────────────────────────────────────────────
# Left: workspace color/icon/name pushed by on-space-changed.sh.
set -g status on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=#181825,fg=#a6adc8"

set -g status-left-length  40
set -g status-left  "#[bg=#{E:MACOS_SPACE_COLOR},fg=#181825,bold] #{E:MACOS_SPACE_ICON}  #{E:MACOS_SPACE_NAME} #[bg=#181825,fg=#{E:MACOS_SPACE_COLOR}] "

# Right: SSH chip (when connected), session name, git branch.
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?SSH_CONNECTION,#[fg=#89dceb]󰒋 #h ,}#[fg=#6c7086]#S #[fg=#cba6f7]#(cd '#{pane_current_path}' && git symbolic-ref --short HEAD 2>/dev/null) "
set -g status-interval 5

# Window list: dim by default; current window picks up the slot colour.
set -g window-status-separator      ""
set -g window-status-format         "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#{E:MACOS_SPACE_COLOR},bold] #I #W "

set -g message-style       "bg=#181825,fg=#{E:MACOS_SPACE_COLOR}"
set -g mode-style          "bg=#{E:MACOS_SPACE_COLOR},fg=#181825"

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#{E:MACOS_SPACE_COLOR}"
