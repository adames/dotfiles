set-option -g default-shell /bin/zsh

# Prefix = C-Space, everywhere (local and SSH). The AeroSpace mode.tmux
# layer that used to front this is retired with AeroSpace itself.
#
# No M-* bindings: ambiguous with ESC byte in Ghostty.
# C-Space C-Space sends a literal C-Space to the inner program.

unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key -N "send literal C-Space"  C-Space send-prefix

bind -N "pane left"  h select-pane -L
bind -N "pane down"  j select-pane -D
bind -N "pane up"    k select-pane -U
bind -N "pane right" l select-pane -R

bind -N "split right (vim Ctrl-w v)" v split-window -h -c "#{pane_current_path}"
bind -N "split below (vim Ctrl-w s)" s split-window -v -c "#{pane_current_path}"
bind -N "split right (alt key)"      | split-window -h -c "#{pane_current_path}"
bind -N "split below (alt key)"      - split-window -v -c "#{pane_current_path}"

bind -N "zoom pane (toggle)"  z resize-pane -Z
bind -N "detach session"      d detach-client
bind -N "reload tmux.conf"    r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# No confirmation on kill — the prompt is too frequent a tax.
bind -N "kill pane (no confirm)"   x kill-pane
bind -N "kill window (no confirm)" & kill-window

bind -N "sessionizer (fzf project picker)" f display-popup -E -w 80% -h 60% "tmux-sessionizer"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# 10ms: ESC sequences arrive complete without making nvim's Esc feel laggy.
set -sg escape-time 10
set -g focus-events on

# OSC 52: let the terminal own the clipboard. A yank inside tmux on a
# remote box (the Linux server, a WSL distro) then lands in the clipboard
# of whichever machine is actually drawing the session — Ghostty and
# Windows Terminal both speak it. Without this, copying out of a remote
# tmux means reaching for the mouse.
set -s set-clipboard on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# ── statusline ───────────────────────────────────────────────────────────
# Static catppuccin-mocha mauve (#cba6f7) accent. The per-workspace
# colour/icon/name once pushed by sigil's on-space-changed.sh was dropped
# in the teardown; the session name sits on the left in its place.
set -g status on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=#181825,fg=#a6adc8"

set -g status-left-length  40
set -g status-left  "#[bg=#cba6f7,fg=#181825,bold] #S #[bg=#181825,fg=#cba6f7] "

set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?SSH_CONNECTION,#[fg=#89dceb]󰒋 #h ,}#[fg=#cba6f7]#(cd '#{pane_current_path}' && git symbolic-ref --short HEAD 2>/dev/null) "
set -g status-interval 5

set -g window-status-separator      ""
set -g window-status-format         "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I #W "

set -g message-style       "bg=#181825,fg=#cba6f7"
set -g mode-style          "bg=#cba6f7,fg=#181825"

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
