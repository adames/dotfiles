set-option -g default-shell /bin/zsh

# C-Space prefix. No Option (M-*) bindings: they collide with Caps-tap-Escape
# in Ghostty, since both start with the ESC byte and any escape-time value
# creates an ambiguity that fires the Option binding when the user wanted ESC.
unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits — v/s mirrors nvim Ctrl-w
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind z resize-pane -Z
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# No confirmation on pane/window kill — git history covers anything that
# matters, and the `Kill pane #N? (y/n)` prompt is a constant friction tax
# in the inner dev loop. Default was `confirm-before -p ... kill-pane`.
bind x kill-pane
bind & kill-window

# fzf project picker → switch/create session
bind f display-popup -E -w 80% -h 60% "tmux-sessionizer"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# 10ms: long enough for escape sequences to arrive complete; short enough
# that nvim's <Esc> feels instant. 0 breaks Caps-tap → ESC + any key.
set -sg escape-time 10
set -g focus-events on

# 24-bit color so the workspace accent (Catppuccin Mocha) lands the way
# Hammerspoon renders it. Ghostty / xterm-256color advertise Tc/RGB.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ── workspace-aware statusline ──────────────────────────────────────────
# MACOS_SPACE_* vars are written into tmux's global session env by the
# yabai signal handler (~/.config/workspace/on-space-changed.sh) via
# `tmux set-environment -g`. #{E:VAR} interpolates them live; requires
# tmux >= 3.2 (bootstrap asserts).
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#11111b,fg=#cdd6f4"

# Left: workspace badge (colored by current space color) + session name.
# The #{?…} falls back to a muted surface color when the env var is
# unset, so a tmux server started before the first space switch still
# renders cleanly.
set -g status-left-length 80
set -g status-left "#[bg=#{?#{E:MACOS_SPACE_COLOR},#{E:MACOS_SPACE_COLOR},#45475a},fg=#1e1e2e,bold] #{?#{E:MACOS_SPACE_ICON},#{E:MACOS_SPACE_ICON} ,}#{E:MACOS_SPACE_INDEX} #{E:MACOS_SPACE_NAME} #[bg=#11111b,fg=#cdd6f4]  #S "

# Right: clock + host.
set -g status-right-length 60
set -g status-right "#[fg=#9399b2] %H:%M #[fg=#6c7086]│#[fg=#9399b2] #h "

# Window list.
set -g window-status-format         "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#cdd6f4,bold] #I:#W "
set -g window-status-separator      ""
set -g pane-border-style            "fg=#313244"
set -g pane-active-border-style     "fg=#585b70"

# DO NOT add MACOS_SPACE_* to update-environment. update-environment copies
# vars from the attaching client's parent env into the SESSION env; if the
# var isn't set there (the usual case — these are written by the yabai
# handler, not exported from a normal shell), tmux marks them for REMOVAL
# in the session, which shadows the global set by `set-environment -g`.
# #{E:VAR} reads session-first, so the badge would render empty. The vars
# live in the global env exclusively and #{E:VAR} falls through to it.
