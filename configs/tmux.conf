# Default shell
set-option -g default-shell /bin/zsh

# ── Prefix: Ctrl-a ───────────────────────────────────────────────────────────
# Why not Option+key (M-*) bindings:
#   Caps Lock tap → Escape, and Option+key → ESC+key in Ghostty.
#   Both start with the ESC byte.  Any escape-time value creates an
#   ambiguity: tap Caps Lock then type a letter and tmux fires the
#   Option binding instead of letting the ESC through.  Removed entirely.
unbind C-b
unbind C-a
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ── Pane navigation ──────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits (v/s mirrors Neovim's Ctrl-w v / Ctrl-w s) ───────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"   # alias
bind - split-window -v -c "#{pane_current_path}"   # alias

# ── Session control ──────────────────────────────────────────────────────────
bind z resize-pane -Z        # zoom pane (toggle)
bind d detach-client         # detach session

# ── Config reload ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Mouse, indexing ──────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# ── Performance ──────────────────────────────────────────────────────────────
# 10ms: long enough for escape sequences to arrive complete (they come in
# microseconds), short enough that Neovim's <Esc> feels instant.
# Do NOT use 0 — it breaks terminal escape sequences when Caps Lock tap
# (→ ESC) is followed quickly by any key.
set -sg escape-time 10
set -g focus-events on
