# Sub-modes live below the sigil fence — any [mode.*.binding] header
# closes mode.main. Keep new main-mode bindings ABOVE that fence.

[mode.move.binding]
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'
esc   = 'mode main'
enter = 'mode main'

# resize -/= doesn't exit so repeats just work; everything else returns
# to mode.main on completion.
[mode.service.binding]
r = ['flatten-workspace-tree', 'layout tiles horizontal vertical', 'mode main']
b = ['balance-sizes', 'mode main']
f = ['layout floating tiling', 'mode main']
h = ['join-with left',  'mode main']
j = ['join-with down',  'mode main']
k = ['join-with up',    'mode main']
l = ['join-with right', 'mode main']
minus = 'resize smart -50'
equal = 'resize smart +50'
backspace = ['close-all-windows-but-current', 'mode main']
enter     = ['reload-config', 'mode main']
esc       = 'mode main'
