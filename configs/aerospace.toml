# AeroSpace config. Rationale + chord inventory: docs/keymap.md.
#
# Two sigil-fenced regions are owned by `ws-topology emit-aerospace`:
#   `# >>> sigil generated: assignments >>>` — top-level workspace table
#   `# >>> sigil generated >>>`              — digit bindings (inside
#                                              [mode.main.binding])
# Edit spaces.json + re-emit. Hand-edits inside either fence are clobbered.

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Top-level — must precede every [...] header.
exec-on-workspace-change = ['/bin/bash', '-c', '$HOME/.config/workspace/on-space-changed.sh']

# outer.top = 26pt reserves the menu-bar strip ws-statusbar lives in.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 26
outer.right = 8

# Float system dialogs by app-id.
[[on-window-detected]]
if.window-title-regex-substring = '^(Copy|Move|Info)$'
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.installer'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SoftwareUpdate'
run = ['layout floating']

# >>> sigil generated: assignments >>>
# (Populated by `ws-topology emit-aerospace --write`.)
# <<< sigil generated: assignments <<<

[mode.main.binding]

# Windows · Focus / Swap / Float — Hyper (⌃⌥⌘⇧) held. Authoritative
# chord docs live in sigil's cheatsheet.json (sections windows-focus +
# submodes); the bindings below are the implementation.
cmd-alt-ctrl-shift-h = 'exec-and-forget $HOME/.local/bin/ws-dir h'
cmd-alt-ctrl-shift-j = 'exec-and-forget $HOME/.local/bin/ws-dir j'
cmd-alt-ctrl-shift-k = 'exec-and-forget $HOME/.local/bin/ws-dir k'
cmd-alt-ctrl-shift-l = 'exec-and-forget $HOME/.local/bin/ws-dir l'

cmd-alt-ctrl-shift-y = 'move left'
cmd-alt-ctrl-shift-u = 'move down'
cmd-alt-ctrl-shift-i = 'move up'
cmd-alt-ctrl-shift-o = 'move right'

cmd-alt-ctrl-shift-a = 'focus-back-and-forth'
cmd-alt-ctrl-shift-c = 'close'
cmd-alt-ctrl-shift-d = 'move-node-to-monitor --wrap-around next'
cmd-alt-ctrl-shift-z = 'fullscreen'

cmd-alt-ctrl-shift-v = 'layout floating tiling'
cmd-alt-ctrl-shift-r = ['flatten-workspace-tree', 'layout tiles horizontal vertical']

# Sub-mode entry — chord stays active in the named mode until esc (or
# another exit binding) returns to mode.main. Bindings for each mode
# live in [mode.move.binding] / [mode.service.binding] below.
cmd-alt-ctrl-shift-s = 'mode service'

# Workspaces · Cycle / Focus / Send. Authoritative chord docs in sigil's
# cheatsheet.json (section: workspaces).
cmd-alt-ctrl-shift-n   = 'exec-and-forget $HOME/.local/bin/ws-focus prev'
cmd-alt-ctrl-shift-p   = 'exec-and-forget $HOME/.local/bin/ws-focus next'
cmd-alt-ctrl-shift-tab = 'exec-and-forget $HOME/.local/bin/ws-focus last'

cmd-alt-ctrl-shift-e = 'exec-and-forget $HOME/.local/bin/ws-picker'
cmd-alt-ctrl-shift-f = 'exec-and-forget $HOME/.local/bin/ws-prompt focus'
cmd-alt-ctrl-shift-g = 'exec-and-forget $HOME/.local/bin/ws-prompt send'
cmd-alt-ctrl-shift-m = 'mode move'
cmd-alt-ctrl-shift-w = 'exec-and-forget $HOME/.local/bin/ws-prompt manage'

# @cs section Launchers
# @cs family system
# @cs sub ws-launch-* · open -a · Hyper held
# @cs idea Apps on the home row · capture beside it · meta on the punctuation row.
# @cs row Caps + t          :: terminal
# @cs row Caps + b          :: browser
# @cs row Caps + .          :: Finder
# @cs row Caps + ;          :: notes
# @cs row Caps + '          :: writing
# @cs row Caps + ,          :: System Settings
# @cs row Caps + /          :: cheatsheet HUD (toggle)
# @cs end

cmd-alt-ctrl-shift-t         = 'exec-and-forget $HOME/.local/bin/ws-launch-terminal'
cmd-alt-ctrl-shift-b         = 'exec-and-forget $HOME/.local/bin/ws-launch-browser'
cmd-alt-ctrl-shift-comma     = 'exec-and-forget open -a "System Settings"'
cmd-alt-ctrl-shift-semicolon = 'exec-and-forget $HOME/.local/bin/ws-launch-notes'
cmd-alt-ctrl-shift-quote     = 'exec-and-forget $HOME/.local/bin/ws-launch-inbox'

# TOML triple-quotes preserve the inline single quotes for osascript.
cmd-alt-ctrl-shift-period    = '''exec-and-forget osascript -e 'tell application "Finder" to make new Finder window' -e 'tell application "Finder" to activate' '''

cmd-alt-ctrl-shift-slash     = 'exec-and-forget $HOME/.local/bin/ws-cheatsheet --toggle'

# Tmux prefix shim — Caps+Space → `tmux send-keys C-Space` (IPC, not
# keystroke injection). Hardcoded brew path: AeroSpace runs under
# launchd with a minimal PATH.
cmd-alt-ctrl-shift-space     = 'exec-and-forget /opt/homebrew/bin/tmux send-keys C-Space'

