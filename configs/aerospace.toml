# ─── sub-modes ──────────────────────────────────────────────────────────────
#
# Any [mode.*.binding] header closes mode.main, so these sit after the
# sigil-generated fence. Keep new main-mode bindings ABOVE that fence.

# mode.move — Caps+m enters; hjkl moves the focused window, esc exits.
# Moves don't auto-exit so repeat taps re-tile without re-entering.
[mode.move.binding]
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'
esc   = 'mode main'
enter = 'mode main'

# mode.service — Caps+s enters; rare ops that don't earn a main-mode
# chord. Most actions exit back to main; resize stays in mode so the
# user can repeat -/= without re-entering.
[mode.service.binding]
r = ['flatten-workspace-tree', 'layout tiles horizontal vertical', 'mode main']
b = ['balance-sizes', 'mode main']
f = ['layout floating tiling', 'mode main']
h = ['join-with left',  'mode main']
j = ['join-with down',  'mode main']
k = ['join-with up',    'mode main']
l = ['join-with right', 'mode main']
minus = 'resize smart -50'
equal = 'resize smart +50'
backspace = ['close-all-windows-but-current', 'mode main']
enter     = ['reload-config', 'mode main']
esc       = 'mode main'
