# AeroSpace configuration (https://github.com/nikitabobko/AeroSpace)
#
# The block between `# >>> sigil generated >>>` and
# `# <<< sigil generated <<<` is OWNED BY ws-topology — run
# `ws-topology emit-aerospace --write` to regenerate it; hand-edits
# inside the fence are clobbered. Everything outside the fence is yours.
#
# Sketchybar invariant: `outer.top = 26` reserves the strip the pill
# bar lives in. Changing it without also moving sketchybar's bar height
# clips the bar against the top window.

# Start AeroSpace at login. Cask installs a LaunchAgent that respects
# this; verify with `aerospace config --get start-at-login`.
start-at-login = true

# Default layout for new workspaces. ws-snap + ws-dir assume tiles when
# they need to route a chord; floating windows are routed via
# on-window-detected below.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Cascade hook: AeroSpace's only subscribe-style event. Fires whenever
# the focused workspace changes; primes ~/.cache/workspace/current.env
# (consumed by tmux + starship). Top-level key — must sit before any
# `[…]` header.
exec-on-workspace-change = ['/bin/bash', '-c', '$HOME/.config/workspace/on-space-changed.sh']

# Gaps. outer.top = 26pt reserves the sketchybar pill strip; the inner
# + side outer gaps keep tiled windows breathing without bleeding into
# the strip or the screen edge.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 26
outer.right = 8

# Mouse-follows-focus is OFF by default in aerospace — no config needed.
# (An earlier draft had a `[mouse-callback]` section here — that's not
# a real aerospace key. Removed.)

# Float system dialogs. Bundle-ID rules cover most modals without
# walking the AX subrole tree.
[[on-window-detected]]
if.window-title-regex-substring = '^(Copy|Move|Info)$'
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.installer'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SoftwareUpdate'
run = ['layout floating']

# Workspace declarations: spaces.json identity layers on top of these.
# Workspaces are "1", "2", etc. by default (matching the digit chords
# below); rename them in spaces.json + here together if you want
# different aerospace identifiers. `--monitor 1` is the primary display.
[workspace-to-monitor-force-assignment]
"1" = 1
"2" = 1
"3" = 1
"4" = 1
"5" = 1
"6" = 1
"7" = 1
"8" = 1
"9" = 1
"10" = 1

# Out-of-fence focus / swap / float / rotate bindings. The sigil-
# generated block at the bottom of this file adds digit-bindings for
# the first ten workspaces.
[mode.main.binding]

# @cs section Windows · Focus / Swap / Float
# @cs family system
# @cs sub Hyper (⌃⌥⌘⇧) — Caps held
# @cs idea hjkl moves focus, yuio swaps; v floats, r re-tiles. Floating windows snap on hjkl instead of focus.
# @cs row Caps + h j k l    :: focus neighbour (tiled) · snap halves / center / fill (floating)
# @cs row Caps + y u i o    :: swap window  ←  ↓  ↑  →
# @cs row Caps + v          :: toggle float ↔ tile
# @cs row Caps + r          :: flatten + rotate workspace tree
# @cs end

# Hyper+hjkl → focus neighbour / snap floating window (ws-dir routes
# based on the focused node's floating-or-tiling status).
cmd-alt-ctrl-shift-h = 'exec-and-forget $HOME/.local/bin/ws-dir h'
cmd-alt-ctrl-shift-j = 'exec-and-forget $HOME/.local/bin/ws-dir j'
cmd-alt-ctrl-shift-k = 'exec-and-forget $HOME/.local/bin/ws-dir k'
cmd-alt-ctrl-shift-l = 'exec-and-forget $HOME/.local/bin/ws-dir l'

# Hyper+yuio → swap window left/down/up/right. (Caps+Shift+hjkl can't
# work as a separate layer because Hyperkey emits cmd+alt+ctrl+shift
# regardless of whether Shift is held — see docs/keymap.md.)
cmd-alt-ctrl-shift-y = 'move left'
cmd-alt-ctrl-shift-u = 'move down'
cmd-alt-ctrl-shift-i = 'move up'
cmd-alt-ctrl-shift-o = 'move right'

# Hyper+v → toggle floating / tiling
cmd-alt-ctrl-shift-v = 'layout floating tiling'

# Hyper+r → flatten + rotate the workspace tree.
cmd-alt-ctrl-shift-r = ['flatten-workspace-tree', 'layout tiles horizontal vertical']

# @cs section Workspaces · Cycle / Focus / Send
# @cs family system
# @cs sub AeroSpace · ws-focus · ws-prompt
# @cs idea Cycle with n/p, jump by digit, or fuzzy-search every window with the e/f/g/w overlays.
# @cs row Caps + n / p      :: prev / next workspace (wraps)
# @cs row Caps + Tab        :: last / recent workspace
# @cs row Caps + 1 … 0      :: focus workspace 1..10
# @cs row Caps + e          :: change workspace (fuzzy: every window in every space)
# @cs row Caps + f          :: focus workspace prompt
# @cs row Caps + g  ·  m    :: send window to workspace
# @cs row Caps + w          :: manage workspace (rename / icon / color)
# @cs end

# Hyper+n / Hyper+p / Hyper+Tab → workspace cycle (prev / next / last)
cmd-alt-ctrl-shift-n   = 'exec-and-forget $HOME/.local/bin/ws-focus prev'
cmd-alt-ctrl-shift-p   = 'exec-and-forget $HOME/.local/bin/ws-focus next'
cmd-alt-ctrl-shift-tab = 'exec-and-forget $HOME/.local/bin/ws-focus last'

# Hyper+e/f/g/m/w → workspace prompts
cmd-alt-ctrl-shift-e = 'exec-and-forget $HOME/.local/bin/ws-picker'
cmd-alt-ctrl-shift-f = 'exec-and-forget $HOME/.local/bin/ws-prompt focus'
cmd-alt-ctrl-shift-g = 'exec-and-forget $HOME/.local/bin/ws-prompt send'
cmd-alt-ctrl-shift-m = 'exec-and-forget $HOME/.local/bin/ws-prompt send'
cmd-alt-ctrl-shift-w = 'exec-and-forget $HOME/.local/bin/ws-prompt manage'

# @cs section Launchers
# @cs family system
# @cs sub ws-launch-* · open -a · Hyper held
# @cs idea Apps on the home row · capture beside it · meta on the punctuation row.
# @cs row Caps + t          :: terminal
# @cs row Caps + b          :: browser
# @cs row Caps + .          :: Finder
# @cs row Caps + q          :: notes
# @cs row Caps + x          :: writing
# @cs row Caps + ,          :: System Settings
# @cs row Caps + /          :: cheatsheet HUD (toggle)
# @cs end

# Launchers
cmd-alt-ctrl-shift-t       = 'exec-and-forget $HOME/.local/bin/ws-launch-terminal'
cmd-alt-ctrl-shift-b       = 'exec-and-forget $HOME/.local/bin/ws-launch-browser'
cmd-alt-ctrl-shift-comma   = 'exec-and-forget open -a "System Settings"'
cmd-alt-ctrl-shift-q       = 'exec-and-forget $HOME/.local/bin/ws-launch-notes'
cmd-alt-ctrl-shift-x       = 'exec-and-forget $HOME/.local/bin/ws-launch-inbox'

# Finder. AppleScript instead of `open -a Finder` so a window is created
# even when Finder already has an active window stack hidden behind other
# apps. TOML triple-single-quotes are literal — the inline single quotes
# stay intact for osascript.
cmd-alt-ctrl-shift-period  = '''exec-and-forget osascript -e 'tell application "Finder" to make new Finder window' -e 'tell application "Finder" to activate' '''

# Cheatsheet HUD. Moved off `;` (semicolon) onto `/` (slash) — the `/` key
# evokes "help" muscle-memory (vim search, web "?" shortcuts). macOS also
# uses Cmd+Shift+/ as the Help-menu search shortcut; Hyperkey adds
# Ctrl+Option so AeroSpace receives a *distinct* chord and grabs it
# before the focused app sees ⌘⇧/. If the system Help menu still appears,
# reload AeroSpace (`aerospace reload-config`) and re-fire — a stale
# config can let chords leak through.
cmd-alt-ctrl-shift-slash   = 'exec-and-forget $HOME/.local/bin/ws-cheatsheet --toggle'

