# AeroSpace config. Chord inventory: docs/keymap.md.
# Sigil-fenced blocks below are clobbered on `ws-topology emit-aerospace`.

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

exec-on-workspace-change = ['/bin/bash', '-c', '$HOME/.config/workspace/on-space-changed.sh']

# Pointer follows focus. Lazy — the mouse only jumps when it isn't
# already inside the newly focused window, so hjkl navigation lands
# the cursor where the keystrokes go without fighting hand-on-mouse.
# Routed through ws-mouse-follow (not a bare move-mouse) so ws-grid's
# focus walk doesn't pinball the pointer on every grid rebuild.
on-focus-changed = ['exec-and-forget $HOME/.local/bin/ws-mouse-follow']

# outer.top = 26pt reserves the menu-bar strip.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 26
outer.right = 8

[[on-window-detected]]
if.window-title-regex-substring = '^(Copy|Move|Info)$'
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.installer'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.SoftwareUpdate'
run = ['layout floating']

# Catch-all: settle new windows into the rows-of-2 grid (ws-grid).
# The float rules above match first and stop (check-further-callbacks
# defaults to false), so dialogs never trigger a re-grid. Toggle with
# `ws-grid auto`.
[[on-window-detected]]
if.during-aerospace-startup = false
run = ['exec-and-forget $HOME/.local/bin/ws-grid detect']

# >>> sigil generated: assignments >>>
# Generated by `ws-topology emit-aerospace`. Hand-edits inside
# this block are clobbered on next regeneration. Edit the source
# of truth in ~/.config/workspace/spaces.json (and re-emit).
#
# Workspace existence + monitor binding. Each name MUST match a
# spaces.json slot's workspaceName; mismatches cause aerospace
# chords (`workspace N`) to fail silently.
[workspace-to-monitor-force-assignment]
"1" = 1
"2" = 1
"3" = 1
"4" = 1
"5" = 1
"6" = 1
"7" = 1
"8" = 1
"9" = 1
"10" = 1
