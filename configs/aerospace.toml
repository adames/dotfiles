[mode.main.binding]

# @cs section Windows
# @cs id      windows-focus
# @cs family  system
# @cs sub     AeroSpace · Hyper (⌃⌥⌘⇧) held
# @cs idea    hjkl focuses, yuio swaps, g grids, r rotates the tiles, x kills.
# @cs row     caps + h j k l :: focus neighbour  ←  ↓  ↑  →
# @cs row     caps + a :: alternate — last window (back-and-forth)
# @cs row     caps + y u i o :: swap window  ←  ↓  ↑  →  (move in tree)
# @cs row     caps + d :: move window to next display (wraps)
# @cs row     caps + v :: toggle float ↔ tile
# @cs row     caps + g :: grid — rows of two, equal tiles (ws-grid)
# @cs row     caps + r :: rotate tiles — windows replace each other
# @cs row     caps + x :: close window
# @cs row     caps + z :: fullscreen toggle (zoom)
# @cs end

cmd-alt-ctrl-shift-h = 'exec-and-forget $HOME/.local/bin/ws-dir h'
cmd-alt-ctrl-shift-j = 'exec-and-forget $HOME/.local/bin/ws-dir j'
cmd-alt-ctrl-shift-k = 'exec-and-forget $HOME/.local/bin/ws-dir k'
cmd-alt-ctrl-shift-l = 'exec-and-forget $HOME/.local/bin/ws-dir l'

cmd-alt-ctrl-shift-y = 'move left'
cmd-alt-ctrl-shift-u = 'move down'
cmd-alt-ctrl-shift-i = 'move up'
cmd-alt-ctrl-shift-o = 'move right'

# a = alternate — bounce between the two most recent windows, even
# across workspaces (window-level analog of Caps+Tab).
cmd-alt-ctrl-shift-a = 'focus-back-and-forth'

cmd-alt-ctrl-shift-c = 'exec-and-forget $HOME/.local/bin/ws-picker'
cmd-alt-ctrl-shift-d = 'move-node-to-monitor --wrap-around next'
cmd-alt-ctrl-shift-x = 'close'
cmd-alt-ctrl-shift-z = 'fullscreen'

cmd-alt-ctrl-shift-v = 'layout floating tiling'

# Grid layout (ws-grid): g rebuilds rows-of-2, r cycles the windows
# through the grid positions. New windows auto-grid via the
# on-window-detected catch-all above.
cmd-alt-ctrl-shift-g = 'exec-and-forget $HOME/.local/bin/ws-grid apply'
cmd-alt-ctrl-shift-r = 'exec-and-forget $HOME/.local/bin/ws-grid rotate'

# Sizing + housekeeping on direct chords (the service drawer is gone —
# one keypress instead of mode-enter → key → exit).
# @cs section Layout ops
# @cs id      submodes
# @cs family  system
# @cs sub     AeroSpace · direct chords (service drawer retired)
# @cs idea    Resize and housekeeping are single chords now — no drawer.
# @cs row     caps + - / = :: resize -50 / +50
# @cs row     caps + e :: equalize window sizes
# @cs row     caps + ⌫ :: close all windows but current
# @cs row     caps + ⏎ :: reload aerospace config
# @cs row     ws-grid auto :: toggle auto-grid on new windows (CLI)
# @cs end
cmd-alt-ctrl-shift-minus     = 'resize smart -50'
cmd-alt-ctrl-shift-equal     = 'resize smart +50'
cmd-alt-ctrl-shift-e         = 'balance-sizes'
cmd-alt-ctrl-shift-backspace = 'close-all-windows-but-current'
cmd-alt-ctrl-shift-enter     = 'reload-config'

# @cs section Workspaces
# @cs id      workspaces
# @cs family  system
# @cs sub     AeroSpace · ws-focus · ws-prompt · ws-picker
# @cs idea    Digits focus a workspace; f sends the window and you go with it; c jumps to any app's window.
# @cs row     caps + n / p :: prev / next workspace (wraps)
# @cs row     caps + tab :: last / recent workspace
# @cs row     caps + 1 … 0 :: go to workspace 1..10
# @cs row     caps + f :: follow — send focused window to slot + travel with it
# @cs row     caps + c :: change application — search by app · tab cycles · ↵
# @cs end

# Workspaces. n/p/tab cycle; 1…0 focus by number (sigil block below);
# f follows — sends the focused window to slot N and travels with it.
# The follow overlay is number-only (digit picks the slot) — modeled on
# AeroSpace's numeric switch; no name search.
cmd-alt-ctrl-shift-n   = 'exec-and-forget $HOME/.local/bin/ws-focus prev'
cmd-alt-ctrl-shift-p   = 'exec-and-forget $HOME/.local/bin/ws-focus next'
cmd-alt-ctrl-shift-tab = 'exec-and-forget $HOME/.local/bin/ws-focus last'

# The 'edit workspace' and 'go' prompts were removed (Caps+1…0 already
# focuses by number; set names / icons with the `ws` CLI: ws name … /
# ws icon …). Caps+e/g have since been rebound: balance + grid.
cmd-alt-ctrl-shift-f = 'exec-and-forget $HOME/.local/bin/ws-prompt send'

# @cs section Launchers
# @cs id      launchers
# @cs family  system
# @cs sub     ws-launch-* · open -a · Hyper held
# @cs idea    Apps on the home row · capture beside it · meta on the punctuation row.
# @cs row     caps + t :: terminal
# @cs row     caps + b :: browser
# @cs row     caps + . :: Finder
# @cs row     caps + ; :: notes
# @cs row     caps + ' :: inbox
# @cs row     caps + , :: System Settings
# @cs row     caps + / :: cheatsheet HUD (toggle)
# @cs row     caps + ␣ :: enter tmux mode (direct commands — see Terminal lens)
# @cs end

# Launchers route through ws-launch-here so the new window lands on
# the focused workspace — `osascript activate` otherwise jumps macOS
# to wherever the app already has a window.
cmd-alt-ctrl-shift-t         = 'exec-and-forget $HOME/.local/bin/ws-launch-here terminal'
cmd-alt-ctrl-shift-b         = 'exec-and-forget $HOME/.local/bin/ws-launch-here browser'
cmd-alt-ctrl-shift-comma     = 'exec-and-forget open -a "System Settings"'
cmd-alt-ctrl-shift-semicolon = 'exec-and-forget $HOME/.local/bin/ws-launch-here notes'
cmd-alt-ctrl-shift-quote     = 'exec-and-forget $HOME/.local/bin/ws-launch-here inbox'

# TOML triple-quotes preserve the inline single quotes for osascript.
cmd-alt-ctrl-shift-period    = '''exec-and-forget osascript -e 'tell application "Finder" to make new Finder window' -e 'tell application "Finder" to activate' '''

cmd-alt-ctrl-shift-slash     = 'exec-and-forget $HOME/.local/bin/ws-cheatsheet --toggle'

cmd-alt-ctrl-shift-space     = 'mode tmux'

# >>> sigil generated >>>
# Generated by `ws-topology emit-aerospace`. Hand-edits inside
# this block are clobbered on next regeneration. Edit the source
# of truth in ~/.config/workspace/spaces.json (and re-emit) or
# the user-owned section of aerospace.toml (above the fence).
#
# This block must live inside an open [mode.main.binding] table —
# do not move it above any [...] header.
# Hyper+digit: focus workspace by name. Digit N → N-th workspace
# in spaces.json composite-key order. Slot 10 is bound to '0'.
cmd-alt-ctrl-shift-1 = 'workspace 1'
cmd-alt-ctrl-shift-2 = 'workspace 2'
cmd-alt-ctrl-shift-3 = 'workspace 3'
cmd-alt-ctrl-shift-4 = 'workspace 4'
cmd-alt-ctrl-shift-5 = 'workspace 5'
cmd-alt-ctrl-shift-6 = 'workspace 6'
cmd-alt-ctrl-shift-7 = 'workspace 7'
cmd-alt-ctrl-shift-8 = 'workspace 8'
cmd-alt-ctrl-shift-9 = 'workspace 9'
cmd-alt-ctrl-shift-0 = 'workspace 10'
# Send-window digit bindings (Caps+Shift+N) intentionally absent —
# Hyperkey collapses Caps+Shift+digit into Caps+digit (same chord).
# Use Caps+f (ws-prompt send) to send a window to a specific workspace.
# <<< sigil generated <<<

# mode.service was retired: resize lives on Caps+-/=, balance on
# Caps+e, close-others on Caps+⌫, reload on Caps+⏎. A drawer earns its
# keystroke tax only when chords run out — they haven't.

# mode.tmux — Caps+Space enters; each key fires a direct tmux command and
# exits. No keystroke injection — direct commands sidestep the send-keys bug.
# Unbound keys are swallowed by AeroSpace while in this mode; press
# esc or space to abort without doing anything.
# @cs section Tmux
# @cs id      tmux
# @cs family  terminal
# @cs sub     Caps+␣ enters AeroSpace mode.tmux — next key fires, then exits
# @cs idea    Direct tmux commands, no keystroke injection. Physical C-Space prefix still works (SSH) — see the prefix column.
# @cs row     caps + ␣ → h j k l :: select pane  ←  ↓  ↑  →
# @cs row     caps + ␣ → v / s / - :: split right / below
# @cs row     caps + ␣ → z :: zoom pane (toggle)
# @cs row     caps + ␣ → d :: detach session
# @cs row     caps + ␣ → r :: reload tmux.conf
# @cs row     caps + ␣ → [ :: copy / scroll mode  (q to exit)
# @cs row     caps + ␣ → f :: sessionizer — fzf pick → switch/create session
# @cs row     caps + ␣ → c :: new window
# @cs row     caps + ␣ → n / p :: next / prev window
# @cs row     caps + ␣ → 1…9 :: go to window N
# @cs row     caps + ␣ → x :: kill pane  (no confirmation)
# @cs row     caps + ␣ → esc / ␣ :: abort — exit mode, nothing fires
# @cs end
[mode.tmux.binding]
esc   = 'mode main'
space = 'mode main'

# pane navigation
h = ['exec-and-forget tmux select-pane -L', 'mode main']
j = ['exec-and-forget tmux select-pane -D', 'mode main']
k = ['exec-and-forget tmux select-pane -U', 'mode main']
l = ['exec-and-forget tmux select-pane -R', 'mode main']

# splits (v/s mirror vim C-w; minus aliases s)
v     = ['exec-and-forget tmux split-window -h -c "#{pane_current_path}"', 'mode main']
s     = ['exec-and-forget tmux split-window -v -c "#{pane_current_path}"', 'mode main']
minus = ['exec-and-forget tmux split-window -v -c "#{pane_current_path}"', 'mode main']

# misc
z = ['exec-and-forget tmux resize-pane -Z',           'mode main']
d = ['exec-and-forget tmux detach-client',            'mode main']
r = ['exec-and-forget tmux source-file ~/.tmux.conf', 'mode main']
x = ['exec-and-forget tmux kill-pane',                'mode main']

# scroll / copy mode
leftSquareBracket = ['exec-and-forget tmux copy-mode', 'mode main']

# sessionizer
f = ['exec-and-forget tmux display-popup -E -w 80% -h 60% tmux-sessionizer', 'mode main']

# window management
c = ['exec-and-forget tmux new-window',      'mode main']
n = ['exec-and-forget tmux next-window',     'mode main']
p = ['exec-and-forget tmux previous-window', 'mode main']

1 = ['exec-and-forget tmux select-window -t :1', 'mode main']
2 = ['exec-and-forget tmux select-window -t :2', 'mode main']
3 = ['exec-and-forget tmux select-window -t :3', 'mode main']
4 = ['exec-and-forget tmux select-window -t :4', 'mode main']
5 = ['exec-and-forget tmux select-window -t :5', 'mode main']
6 = ['exec-and-forget tmux select-window -t :6', 'mode main']
7 = ['exec-and-forget tmux select-window -t :7', 'mode main']
8 = ['exec-and-forget tmux select-window -t :8', 'mode main']
9 = ['exec-and-forget tmux select-window -t :9', 'mode main']
