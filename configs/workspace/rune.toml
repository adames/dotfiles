# rune.toml — generates the cheatsheet HUD (Caps + /).
#
# Sources are the @cs-annotated configs; the 4 lenses below mirror the old
# cheatsheet-layout.json. Bootstrap runs `rune build` against this to emit
# cheatsheet.json, which the surviving ws-cheatsheet HUD binary renders. The
# HUD is built purely from @cs annotations (vim-motion / vim-edit live as @cs
# blocks in nvim-init.lua) — no committed-JSON merge.
root = "~/dotfiles"
banner = [
  { k = "Caps", v = "Hyper (⌃⌥⌘⇧) — single layer; tap = Esc" },
  { k = "Caps+␣", v = "tmux mode" },
]

[[annotate]]
path = "configs/aerospace.toml"      # windows-focus, submodes, workspaces, launchers, tmux
[[annotate]]
path = "configs/tmux.conf"           # tmux-prefix
[[annotate]]
path = "configs/zshrc"               # shell
[[annotate]]
path = "configs/nvim-init.lua"        # neovim-*, vim-motion, vim-edit

[[view]]
id = "aero"
label = "AeroSpace"
key = "1"
columns = [ ["windows-focus", "submodes"], ["workspaces", "launchers"], [] ]

[[view]]
id = "term"
label = "Terminal"
key = "2"
columns = [ ["tmux"], ["shell"], ["tmux-prefix"] ]

[[view]]
id = "vim"
label = "Vim"
key = "3"
columns = [ ["vim-motion"], ["vim-edit"], [] ]

[[view]]
id = "nvim"
label = "Neovim"
key = "4"
columns = [ ["neovim-files-buffers"], ["neovim-lsp-search"], [] ]
